<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fredflix - Player</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #141414;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .player-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 15px;
    }
    .back-btn {
      color: #ff6600;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 15px;
    }
    .back-btn:hover {
      color: #ff8533;
    }
    iframe {
      width: 100%;
      height: 75vh;
      border: none;
      background: #000;
      border-radius: 8px;
    }
    .player-title {
      font-size: 1.8rem;
      margin: 15px 0 5px 0;
    }
    .episode-info {
      color: #aaa;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="player-container">
    <a href="index.html" class="back-btn">← Back to Browse</a>
    
    <h1 class="player-title" id="title">Loading...</h1>
    <p class="episode-info" id="episodeInfo"></p>

    <iframe id="videoFrame" allowfullscreen allow="autoplay"></iframe>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    
    const title = decodeURIComponent(urlParams.get('title') || 'Watching');
    const id = urlParams.get('id');
    const type = urlParams.get('type');
    const season = urlParams.get('season');
    const episode = urlParams.get('episode');

    // Set titles
    document.getElementById('title').textContent = title;
    
    if (type === 'tv' && season && episode) {
      document.getElementById('episodeInfo').textContent = `Season ${season} • Episode ${episode}`;
    }

    // Build embed URL
    let embedUrl = '';

    if (type === 'tv' && season && episode) {
      // TV Episode
      embedUrl = `https://vidsrc-embed.ru/embed/tv/${id}/${season}-${episode}`;
    } 
    else if (type === 'tv') {
      // TV Show (default to S1E1)
      embedUrl = `https://vidsrc-embed.ru/embed/tv/${id}/1-1`;
    } 
    else {
      // Movie
      embedUrl = `https://vidsrc-embed.ru/embed/movie/${id}`;
    }

    // Load the iframe
    document.getElementById('videoFrame').src = embedUrl;

    // Optional: Save to Continue Watching when video starts playing
    window.addEventListener('load', () => {
      if (typeof addToContinueWatching === 'function') {
        addToContinueWatching({
          id: parseInt(id),
          type: type,
          title: title,
          season: season ? parseInt(season) : null,
          episode: episode ? parseInt(episode) : null,
          progress: 10, // starting progress
          poster_path: ''
        });
      }
    });
  </script>
</body>
</html>
