<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fredflix - Player</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #141414;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .player-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 15px;
    }
    .back-btn {
      color: #ff6600;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 15px;
    }
    iframe {
      width: 100%;
      height: 75vh;
      min-height: 500px;
      border: none;
      background: #000;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .player-title {
      font-size: 1.9rem;
      margin: 15px 0 5px 0;
    }
    .episode-info {
      color: #aaa;
      margin-bottom: 20px;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <div class="player-container">
    <a href="index.html" class="back-btn">← Back to Browse</a>
    
    <h1 class="player-title" id="title">Loading...</h1>
    <p class="episode-info" id="episodeInfo"></p>

    <iframe id="videoFrame" allowfullscreen allow="autoplay; encrypted-media"></iframe>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    
    const title = decodeURIComponent(urlParams.get('title') || 'Watching');
    const tmdbId = urlParams.get('id');
    const type = urlParams.get('type');
    const season = urlParams.get('season');
    const episode = urlParams.get('episode');

    // Set page title and info
    document.getElementById('title').textContent = title;
    
    if (type === 'tv' && season && episode) {
      document.getElementById('episodeInfo').textContent = `Season ${season} • Episode ${episode}`;
    }

    // Build AnyEmbed URL
    let embedUrl = '';

    if (type === 'tv' && season && episode) {
      embedUrl = `https://anyembed.com/embed/tmdb-tv-${tmdbId}-${season}-${episode}`;
    } 
    else if (type === 'tv') {
      embedUrl = `https://anyembed.com/embed/tmdb-tv-${tmdbId}-1-1`;
    } 
    else {
      embedUrl = `https://anyembed.com/embed/tmdb-movie-${tmdbId}`;
    }

    // Load the player
    document.getElementById('videoFrame').src = embedUrl;

    // Save to Continue Watching
    function saveProgress() {
      if (typeof addToContinueWatching === 'function') {
        addToContinueWatching({
          id: parseInt(tmdbId),
          type: type,
          title: title,
          season: season ? parseInt(season) : null,
          episode: episode ? parseInt(episode) : null,
          progress: 30,        // You can improve this later with real progress
          poster_path: ''
        });
      }
    }

    // Auto save when player loads
    window.addEventListener('load', () => {
      setTimeout(saveProgress, 3000);
    });
  </script>
</body>
</html>
